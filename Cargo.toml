[package]
name = "saltwater"
version = "0.11.0"
authors = [
  "Joshua Nelson <jyn514@gmail.com>",
  "Graham Scheaffer <me@gisch.dev>",
  "Wesley Norris <repnop@outlook.com>",
  "playX",
  "Kevin Becker <k.becker@byter.dev>",
  "Hunter Damron <hdamron@email.sc.edu>",
  "Justus K <justus.k@protonmail.com>",
]
edition = "2021"
description = "A C compiler written in Rust, with a focus on good error messages."
repository = "https://github.com/jyn514/saltwater/"
readme = "README.md"
categories = ["development-tools", "parser-implementations"]
license = "BSD-3-Clause"
keywords = ["C", "compiler", "recursive-descent", "cranelift"]
default-run = "swcc"
documentation = "https://docs.rs/saltwater"

[dependencies]
ansi_term = "0.12"
arcstr = "1.2"
tempfile = "3.9"
pico-args = { version = "0.5", features = ["short-space-opt"] }
color-backtrace = { version = "0.6", default-features = false, optional = true }
atty = { version = "0.2", default-features = false }
cranelift = "0.116"
cranelift-module = "0.116"
cranelift-object = "0.116"
cranelift-codegen = "0.116"
target-lexicon = "0.13"
lazy_static = "1.4"
hexponent = "0.3"
thiserror = "^2.0"
lasso = "0.7"
codespan = { version = "0.11", default-features = false }
counter = "0.6"
shared_str = "0.1.1"
time = {version="0.3", features = ["local-offset", "macros", "formatting", "std"]}

[dev-dependencies]
env_logger = { version = "0.11", default-features = false }
log = "0.4.2"
walkdir = "2.5"
proptest = "^1.5"
proptest-derive = "0.5"

[features]
default = ["color-backtrace"]
# for internal use
#_test_headers = []

[workspace]

[[bin]]
name = "swcc"
path = "src/main.rs"


[[test]]
name = "runner"

[[test]]
name = "varargs"

[[test]]
name = "headers"
# MacOS breaks if you pass -undef to the system preprocessor
#required-features = ["_test_header"]

[profile.release]
lto = true

[profile.test]
debug = true  # speeds up link time

[profile.bench]
opt-level = 3
debug = false
lto = true
debug-assertions = false
codegen-units = 1
incremental = false
overflow-checks = false

[package.metadata.docs.rs]
all-features = true
# opt-out of non-default targets
targets = []
